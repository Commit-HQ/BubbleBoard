name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  # Makes the tag's GitHub release, with that version's section of CHANGELOG.md as its notes
  # (docs/development.md#releasing). It deploys nothing.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take the version's notes from the changelog
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '/^## /{if(found)exit; found=($2==version); next} found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no entry for ${GITHUB_REF_NAME#v}."
            exit 1
          fi
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
