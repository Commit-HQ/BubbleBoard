<!-- The app icon: favicon.svg's gradient and bubbles, full bleed, with the bubbles inside the round safe zone that launchers crop maskable icons to. static/icons/*.png are renderings of it at 192, 512, and 180 (Apple touch icon) pixels. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset=".6" stop-color="#ff6fb1"/><stop offset="1" stop-color="#ffb36b"/></linearGradient></defs><rect width="512" height="512" fill="url(#g)"/><g transform="translate(28.5 35.5) scale(7)"><circle cx="27" cy="36" r="15" fill="#fff"/><circle cx="46" cy="19" r="7" fill="#fff" fill-opacity=".75"/><circle cx="47" cy="45" r="4.5" fill="#fff" fill-opacity=".55"/></g></svg>
